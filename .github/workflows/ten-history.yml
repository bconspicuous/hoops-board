name: ten · BR game logs 2021-2026 (one-off)
# Collects per-game logs for the v2 projection model into ten/data/history/. Manual only; resumable.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "max requests (0 = all)"
        default: "0"
permissions:
  contents: write
concurrency:
  group: ten-history
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fetch BR game logs
        env:
          LIMIT: ${{ github.event.inputs.limit }}
        run: python ten/espn/fetch_history.py
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ten/data/history
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ten: BR game logs batch $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST')"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
